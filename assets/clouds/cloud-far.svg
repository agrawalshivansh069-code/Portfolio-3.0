<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 200" width="1920" height="200" shape-rendering="crispEdges">
  <defs>
    <style>
      .c-light { fill: #FFE5D9; opacity: 0.85; }
      .c-peach { fill: #FFCAD4; opacity: 0.75; }
      .c-apricot { fill: #FEC89A; opacity: 0.65; }
      .c-shadow { fill: #D8B4E2; opacity: 0.55; }
    </style>
  </defs>
  <!-- Cluster 1 (Left bank) -->
  <g transform="translate(40, 20)">
    <!-- Base shadow -->
    <rect x="60" y="50" width="220" height="20" class="c-shadow"/>
    <rect x="40" y="40" width="260" height="15" class="c-apricot"/>
    <rect x="80" y="25" width="180" height="20" class="c-peach"/>
    <rect x="100" y="10" width="140" height="20" class="c-light"/>
    <rect x="130" y="0" width="80" height="12" class="c-light"/>
    <!-- stepped pixel edges -->
    <rect x="30" y="45" width="15" height="10" class="c-shadow"/>
    <rect x="290" y="45" width="20" height="10" class="c-shadow"/>
    <rect x="230" y="15" width="30" height="10" class="c-peach"/>
  </g>

  <!-- Cluster 2 (Mid-left low stratus) -->
  <g transform="translate(360, 50)">
    <rect x="30" y="40" width="340" height="18" class="c-shadow"/>
    <rect x="10" y="30" width="370" height="14" class="c-apricot"/>
    <rect x="50" y="18" width="280" height="16" class="c-peach"/>
    <rect x="80" y="6" width="180" height="16" class="c-light"/>
    <rect x="120" y="0" width="90" height="10" class="c-light"/>
  </g>

  <!-- Cluster 3 (Center high bank) -->
  <g transform="translate(820, 15)">
    <rect x="40" y="60" width="280" height="20" class="c-shadow"/>
    <rect x="20" y="45" width="320" height="18" class="c-apricot"/>
    <rect x="50" y="30" width="250" height="18" class="c-peach"/>
    <rect x="80" y="15" width="170" height="18" class="c-light"/>
    <rect x="110" y="0" width="100" height="18" class="c-light"/>
    <!-- stepped puffs -->
    <rect x="240" y="22" width="60" height="15" class="c-peach"/>
    <rect x="0" y="52" width="25" height="12" class="c-shadow"/>
  </g>

  <!-- Cluster 4 (Mid-right bank) -->
  <g transform="translate(1220, 40)">
    <rect x="50" y="50" width="270" height="18" class="c-shadow"/>
    <rect x="20" y="38" width="320" height="16" class="c-apricot"/>
    <rect x="60" y="22" width="240" height="18" class="c-peach"/>
    <rect x="90" y="8" width="160" height="18" class="c-light"/>
    <rect x="120" y="0" width="80" height="10" class="c-light"/>
  </g>

  <!-- Cluster 5 (Far right wraparound bank) -->
  <g transform="translate(1600, 25)">
    <rect x="40" y="55" width="260" height="18" class="c-shadow"/>
    <rect x="20" y="42" width="290" height="16" class="c-apricot"/>
    <rect x="50" y="26" width="220" height="18" class="c-peach"/>
    <rect x="80" y="12" width="150" height="18" class="c-light"/>
    <rect x="110" y="0" width="70" height="14" class="c-light"/>
    <!-- seamless loop overlap into x=0 -->
    <rect x="270" y="50" width="60" height="15" class="c-shadow"/>
  </g>
</svg>
