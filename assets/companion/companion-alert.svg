<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <defs>
    <style>
      .c-hair { fill: #2B2D42; }
      .c-skin { fill: #FFDFC4; }
      .c-shadow { fill: #F0B892; }
      .c-hoodie { fill: #8D5B4C; }
      .c-hoodie-trim { fill: #D68C72; }
      .c-pant { fill: #1D2D44; }
      .c-shoe { fill: #F4A261; }
      .c-eye { fill: #1E1B18; }
      .c-sparkle { fill: #FFFFFF; }
      .c-alert { fill: #FF0055; }
    </style>
  </defs>

  <!-- Big Red Alert Exclamation (!) above head -->
  <rect x="30" y="2" width="4" height="6" class="c-alert"/>
  <rect x="30" y="10" width="4" height="3" class="c-alert"/>

  <!-- Hair / Head -->
  <rect x="20" y="14" width="24" height="6" class="c-hair"/>
  <rect x="16" y="20" width="32" height="8" class="c-hair"/>
  <rect x="14" y="28" width="6" height="10" class="c-hair"/>
  <rect x="44" y="28" width="6" height="10" class="c-hair"/>
  <rect x="20" y="20" width="6" height="8" class="c-hair"/>
  <rect x="38" y="20" width="6" height="6" class="c-hair"/>

  <!-- Face -->
  <rect x="20" y="26" width="24" height="13" class="c-skin"/>
  <rect x="22" y="39" width="20" height="3" class="c-shadow"/>

  <!-- Wide Alert Dilated Eyes (o_o) -->
  <rect x="23" y="29" width="6" height="6" class="c-eye"/>
  <rect x="24" y="30" width="2" height="2" class="c-sparkle"/>
  <rect x="35" y="29" width="6" height="6" class="c-eye"/>
  <rect x="36" y="30" width="2" height="2" class="c-sparkle"/>

  <!-- Small surprised open mouth (o) -->
  <rect x="30" y="37" width="4" height="2" class="c-eye"/>

  <!-- Developer Headset -->
  <rect x="12" y="28" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="48" y="28" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="16" y="14" width="32" height="2" class="c-hoodie-trim"/>

  <!-- Body (Perked upright) -->
  <rect x="18" y="42" width="28" height="12" class="c-hoodie"/>
  <rect x="28" y="42" width="8" height="12" class="c-hoodie-trim"/>
  <rect x="14" y="43" width="4" height="7" class="c-hoodie"/>
  <rect x="46" y="43" width="4" height="7" class="c-hoodie"/>

  <!-- Pants -->
  <rect x="22" y="54" width="8" height="5" class="c-pant"/>
  <rect x="34" y="54" width="8" height="5" class="c-pant"/>

  <!-- Shoes -->
  <rect x="20" y="59" width="10" height="3" class="c-shoe"/>
  <rect x="34" y="59" width="10" height="3" class="c-shoe"/>
</svg>
