<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <defs>
    <style>
      .c-hair { fill: #2B2D42; }
      .c-skin { fill: #FFDFC4; }
      .c-shadow { fill: #F0B892; }
      .c-hoodie { fill: #8D5B4C; }
      .c-hoodie-trim { fill: #D68C72; }
      .c-pant { fill: #1D2D44; }
      .c-shoe { fill: #F4A261; }
      .c-eye { fill: #1E1B18; }
      .c-sparkle { fill: #FFFFFF; }
      .c-blush { fill: #FF85A1; opacity: 0.7; }
    </style>
  </defs>

  <!-- Hair / Head -->
  <rect x="20" y="8" width="24" height="6" class="c-hair"/>
  <rect x="16" y="14" width="32" height="8" class="c-hair"/>
  <rect x="14" y="22" width="6" height="12" class="c-hair"/>
  <rect x="44" y="22" width="6" height="12" class="c-hair"/>
  <rect x="20" y="14" width="6" height="8" class="c-hair"/>
  <rect x="38" y="14" width="6" height="6" class="c-hair"/>

  <!-- Face -->
  <rect x="20" y="20" width="24" height="14" class="c-skin"/>
  <rect x="22" y="34" width="20" height="4" class="c-shadow"/>

  <!-- Surprised Floaty Eyes (O_O) -->
  <rect x="23" y="24" width="5" height="5" class="c-eye"/>
  <rect x="24" y="25" width="2" height="2" class="c-sparkle"/>
  <rect x="36" y="24" width="5" height="5" class="c-eye"/>
  <rect x="37" y="25" width="2" height="2" class="c-sparkle"/>

  <!-- Blushing cheeks -->
  <rect x="21" y="29" width="3" height="2" class="c-blush"/>
  <rect x="40" y="29" width="3" height="2" class="c-blush"/>

  <!-- Cute little "waah" mouth -->
  <rect x="30" y="31" width="4" height="3" class="c-eye"/>

  <!-- Developer Headset -->
  <rect x="12" y="24" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="48" y="24" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="16" y="8" width="32" height="2" class="c-hoodie-trim"/>

  <!-- Flapping Arms (stretched out while being carried) -->
  <rect x="10" y="36" width="8" height="4" class="c-hoodie"/>
  <rect x="6" y="34" width="4" height="4" class="c-skin"/>
  <rect x="46" y="36" width="8" height="4" class="c-hoodie"/>
  <rect x="54" y="34" width="4" height="4" class="c-skin"/>

  <!-- Body -->
  <rect x="18" y="38" width="28" height="13" class="c-hoodie"/>
  <rect x="28" y="38" width="8" height="13" class="c-hoodie-trim"/>

  <!-- Dangling legs swaying loosely -->
  <rect x="21" y="51" width="7" height="6" class="c-pant"/>
  <rect x="36" y="51" width="7" height="6" class="c-pant"/>

  <!-- Dangling Shoes -->
  <rect x="18" y="57" width="9" height="4" class="c-shoe"/>
  <rect x="37" y="57" width="9" height="4" class="c-shoe"/>
</svg>
