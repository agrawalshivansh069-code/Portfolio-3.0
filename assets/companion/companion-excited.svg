<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <defs>
    <style>
      .c-hair { fill: #2B2D42; }
      .c-skin { fill: #FFDFC4; }
      .c-shadow { fill: #F0B892; }
      .c-hoodie { fill: #8D5B4C; }
      .c-hoodie-trim { fill: #D68C72; }
      .c-pant { fill: #1D2D44; }
      .c-shoe { fill: #F4A261; }
      .c-eye { fill: #1E1B18; }
      .c-sparkle { fill: #FFD166; }
      .c-blush { fill: #FF477E; opacity: 0.9; }
      .c-particle { fill: #FFE66D; }
    </style>
  </defs>

  <!-- Excitement glints/stars around head -->
  <rect x="8" y="10" width="3" height="3" class="c-particle"/>
  <rect x="52" y="8" width="4" height="4" class="c-particle"/>
  <rect x="50" y="22" width="2" height="2" class="c-particle"/>

  <!-- Arms raised high in celebration -->
  <rect x="10" y="24" width="4" height="8" class="c-hoodie"/>
  <rect x="8" y="20" width="5" height="4" class="c-skin"/>
  <rect x="50" y="24" width="4" height="8" class="c-hoodie"/>
  <rect x="51" y="20" width="5" height="4" class="c-skin"/>

  <!-- Hair / Head -->
  <rect x="20" y="6" width="24" height="6" class="c-hair"/>
  <rect x="16" y="12" width="32" height="8" class="c-hair"/>
  <rect x="14" y="20" width="6" height="12" class="c-hair"/>
  <rect x="44" y="20" width="6" height="12" class="c-hair"/>
  <rect x="20" y="12" width="6" height="8" class="c-hair"/>
  <rect x="38" y="12" width="6" height="6" class="c-hair"/>

  <!-- Face -->
  <rect x="20" y="18" width="24" height="14" class="c-skin"/>
  <rect x="22" y="32" width="20" height="4" class="c-shadow"/>

  <!-- Starry Sparkle Eyes -->
  <rect x="25" y="21" width="2" height="6" class="c-sparkle"/>
  <rect x="23" y="23" width="6" height="2" class="c-sparkle"/>
  <rect x="37" y="21" width="2" height="6" class="c-sparkle"/>
  <rect x="35" y="23" width="6" height="2" class="c-sparkle"/>

  <!-- Blushing cheeks -->
  <rect x="20" y="26" width="4" height="3" class="c-blush"/>
  <rect x="40" y="26" width="4" height="3" class="c-blush"/>

  <!-- Wide happy mouth -->
  <rect x="28" y="28" width="8" height="4" class="c-eye"/>
  <rect x="30" y="29" width="4" height="2" class="c-blush"/>

  <!-- Developer Headset -->
  <rect x="12" y="22" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="48" y="22" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="16" y="6" width="32" height="2" class="c-hoodie-trim"/>

  <!-- Hoodie Body (Jumping pose) -->
  <rect x="18" y="36" width="28" height="14" class="c-hoodie"/>
  <rect x="28" y="36" width="8" height="14" class="c-hoodie-trim"/>

  <!-- Pants (Tucked jumping legs) -->
  <rect x="21" y="50" width="8" height="5" class="c-pant"/>
  <rect x="35" y="50" width="8" height="5" class="c-pant"/>

  <!-- Shoes (Floating slightly off ground) -->
  <rect x="19" y="55" width="10" height="4" class="c-shoe"/>
  <rect x="35" y="55" width="10" height="4" class="c-shoe"/>
</svg>
