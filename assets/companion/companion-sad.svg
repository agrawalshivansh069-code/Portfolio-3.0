<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <defs>
    <style>
      .c-hair { fill: #2B2D42; }
      .c-skin { fill: #FFDFC4; }
      .c-shadow { fill: #F0B892; }
      .c-hoodie { fill: #8D5B4C; }
      .c-hoodie-trim { fill: #D68C72; }
      .c-pant { fill: #1D2D44; }
      .c-shoe { fill: #F4A261; }
      .c-eye { fill: #1E1B18; }
      .c-sparkle { fill: #FFFFFF; }
      .c-tear { fill: #4EA8DE; }
    </style>
  </defs>

  <!-- Drooped Head -->
  <rect x="20" y="10" width="24" height="6" class="c-hair"/>
  <rect x="16" y="16" width="32" height="8" class="c-hair"/>
  <rect x="14" y="24" width="6" height="12" class="c-hair"/>
  <rect x="44" y="24" width="6" height="12" class="c-hair"/>
  <rect x="20" y="16" width="6" height="8" class="c-hair"/>
  <rect x="38" y="16" width="6" height="6" class="c-hair"/>

  <!-- Face -->
  <rect x="20" y="22" width="24" height="14" class="c-skin"/>
  <rect x="22" y="36" width="20" height="4" class="c-shadow"/>

  <!-- Sad drooping eyes (T_T or downcast) -->
  <rect x="23" y="27" width="5" height="3" class="c-eye"/>
  <rect x="24" y="26" width="4" height="1" class="c-eye"/>
  <rect x="36" y="27" width="5" height="3" class="c-eye"/>
  <rect x="36" y="26" width="4" height="1" class="c-eye"/>

  <!-- Little pixel tear -->
  <rect x="21" y="30" width="2" height="4" class="c-tear"/>
  <rect x="22" y="34" width="2" height="2" class="c-tear"/>

  <!-- Inverted sad mouth -->
  <rect x="30" y="33" width="4" height="1" class="c-eye"/>
  <rect x="29" y="34" width="2" height="1" class="c-eye"/>
  <rect x="33" y="34" width="2" height="1" class="c-eye"/>

  <!-- Developer Headset -->
  <rect x="12" y="26" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="48" y="26" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="16" y="10" width="32" height="2" class="c-hoodie-trim"/>

  <!-- Body -->
  <rect x="18" y="40" width="28" height="13" class="c-hoodie"/>
  <rect x="28" y="40" width="8" height="13" class="c-hoodie-trim"/>
  <!-- Arms slumped down -->
  <rect x="14" y="43" width="4" height="9" class="c-hoodie"/>
  <rect x="14" y="52" width="4" height="3" class="c-skin"/>
  <rect x="46" y="43" width="4" height="9" class="c-hoodie"/>
  <rect x="46" y="52" width="4" height="3" class="c-skin"/>

  <!-- Pants -->
  <rect x="22" y="53" width="8" height="6" class="c-pant"/>
  <rect x="34" y="53" width="8" height="6" class="c-pant"/>

  <!-- Shoes -->
  <rect x="20" y="59" width="10" height="3" class="c-shoe"/>
  <rect x="34" y="59" width="10" height="3" class="c-shoe"/>
</svg>
