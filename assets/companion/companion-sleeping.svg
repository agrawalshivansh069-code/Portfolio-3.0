<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <defs>
    <style>
      .c-hair { fill: #2B2D42; }
      .c-skin { fill: #FFDFC4; }
      .c-shadow { fill: #F0B892; }
      .c-hoodie { fill: #8D5B4C; }
      .c-hoodie-trim { fill: #D68C72; }
      .c-pant { fill: #1D2D44; }
      .c-shoe { fill: #F4A261; }
      .c-eye { fill: #1E1B18; }
      .c-blush { fill: #FFB5A7; opacity: 0.6; }
      .c-zzz { fill: #C8B3FF; font-family: monospace; font-size: 8px; font-weight: bold; }
    </style>
  </defs>

  <!-- Floating Zzz -->
  <rect x="48" y="10" width="5" height="1" fill="#C8B3FF"/>
  <rect x="51" y="11" width="1" height="1" fill="#C8B3FF"/>
  <rect x="50" y="12" width="1" height="1" fill="#C8B3FF"/>
  <rect x="49" y="13" width="1" height="1" fill="#C8B3FF"/>
  <rect x="48" y="14" width="5" height="1" fill="#C8B3FF"/>

  <rect x="54" y="4" width="6" height="1" fill="#D8B4E2"/>
  <rect x="58" y="5" width="1" height="1" fill="#D8B4E2"/>
  <rect x="57" y="6" width="1" height="1" fill="#D8B4E2"/>
  <rect x="56" y="7" width="1" height="1" fill="#D8B4E2"/>
  <rect x="54" y="8" width="6" height="1" fill="#D8B4E2"/>

  <!-- Hair / Head -->
  <rect x="18" y="12" width="24" height="6" class="c-hair"/>
  <rect x="14" y="18" width="32" height="8" class="c-hair"/>
  <rect x="12" y="26" width="6" height="12" class="c-hair"/>
  <rect x="42" y="26" width="6" height="12" class="c-hair"/>
  <rect x="18" y="18" width="6" height="8" class="c-hair"/>
  <rect x="36" y="18" width="6" height="6" class="c-hair"/>

  <!-- Face -->
  <rect x="18" y="24" width="24" height="14" class="c-skin"/>
  <rect x="20" y="38" width="20" height="4" class="c-shadow"/>

  <!-- Sleeping Closed Eyes (-.-) -->
  <rect x="22" y="29" width="6" height="2" class="c-eye"/>
  <rect x="34" y="29" width="6" height="2" class="c-eye"/>

  <!-- Peaceful soft blush -->
  <rect x="19" y="32" width="4" height="2" class="c-blush"/>
  <rect x="39" y="32" width="4" height="2" class="c-blush"/>

  <!-- Developer Headset -->
  <rect x="10" y="28" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="46" y="28" width="4" height="8" class="c-hoodie-trim"/>
  <rect x="14" y="12" width="32" height="2" class="c-hoodie-trim"/>

  <!-- Body (Curled sitting pose) -->
  <rect x="16" y="42" width="28" height="12" class="c-hoodie"/>
  <rect x="26" y="42" width="8" height="12" class="c-hoodie-trim"/>

  <!-- Arms folded across -->
  <rect x="20" y="46" width="20" height="4" class="c-hoodie"/>
  <rect x="28" y="46" width="4" height="3" class="c-skin"/>

  <!-- Sitting Legs / Shoes -->
  <rect x="16" y="54" width="12" height="5" class="c-pant"/>
  <rect x="32" y="54" width="12" height="5" class="c-pant"/>
  <rect x="14" y="58" width="14" height="4" class="c-shoe"/>
  <rect x="32" y="58" width="14" height="4" class="c-shoe"/>
</svg>
