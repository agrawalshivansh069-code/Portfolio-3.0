<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Retro Message Envelope / Dialogue Bubble -->
  <rect x="6" y="10" width="36" height="26" fill="#7EE7E2"/>
  <rect x="6" y="34" width="36" height="2" fill="#48B8B3"/>
  <rect x="6" y="10" width="2" height="26" fill="#48B8B3"/>
  <rect x="40" y="10" width="2" height="26" fill="#48B8B3"/>

  <!-- Envelope Flap Lines -->
  <polygon points="6,12 24,24 42,12 42,10 6,10" fill="#A8F0EC"/>
  <!-- Envelope bottom folds -->
  <polygon points="6,34 20,24 6,12" fill="#5DC4BF" opacity="0.4"/>
  <polygon points="42,34 28,24 42,12" fill="#5DC4BF" opacity="0.4"/>

  <!-- Heart/Star stamp in center -->
  <rect x="22" y="20" width="4" height="4" fill="#FF5E7E"/>
</svg>
