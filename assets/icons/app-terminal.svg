<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Retro Terminal Console -->
  <rect x="6" y="8" width="36" height="32" fill="#1D2D44"/>
  <rect x="6" y="8" width="36" height="6" fill="#2B2D42"/>
  <!-- Window buttons -->
  <rect x="10" y="10" width="3" height="3" fill="#FF5E7E"/>
  <rect x="15" y="10" width="3" height="3" fill="#FFD166"/>
  <rect x="20" y="10" width="3" height="3" fill="#06D6A0"/>

  <!-- Command Prompt (>_) in Neon Green -->
  <rect x="12" y="20" width="2" height="6" fill="#7EE7E2"/>
  <rect x="14" y="22" width="2" height="2" fill="#7EE7E2"/>
  <rect x="16" y="24" width="2" height="2" fill="#7EE7E2"/>
  <rect x="14" y="26" width="2" height="2" fill="#7EE7E2"/>

  <!-- Blinking Cursor -->
  <rect x="20" y="28" width="4" height="2" fill="#FFE66D"/>
</svg>
