<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 120" width="1920" height="120" shape-rendering="crispEdges">
  <defs>
    <style>
      .g-grass-light { fill: #A3E4D7; }
      .g-grass { fill: #48C9B0; }
      .g-grass-dark { fill: #1E8449; }
      .g-earth-top { fill: #34495E; }
      .g-earth-base { fill: #1B2631; }
      .g-flower-pink { fill: #FF9AA2; }
      .g-flower-gold { fill: #FFDAC1; }
      .g-stone { fill: #7F8C8D; }
    </style>
  </defs>

  <!-- Deep ground foundation -->
  <rect x="0" y="45" width="1920" height="75" class="g-earth-base"/>
  <rect x="0" y="30" width="1920" height="20" class="g-earth-top"/>

  <!-- Stepped pixel grass band -->
  <rect x="0" y="15" width="1920" height="20" class="g-grass-dark"/>
  <rect x="0" y="10" width="1920" height="10" class="g-grass"/>

  <!-- Repeated stepped grass tufts across the width -->
  <!-- Pattern block 1 (0 to 320) -->
  <g>
    <!-- Tufts -->
    <rect x="15" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="21" y="2" width="6" height="14" class="g-grass-light"/>
    <rect x="27" y="6" width="6" height="10" class="g-grass"/>
    <rect x="75" y="0" width="6" height="16" class="g-grass-light"/>
    <rect x="81" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="140" y="2" width="6" height="14" class="g-grass-light"/>
    <rect x="146" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="220" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="280" y="2" width="6" height="14" class="g-grass-light"/>
    <!-- Flowers -->
    <rect x="45" y="6" width="8" height="8" class="g-flower-pink"/>
    <rect x="47" y="4" width="4" height="4" class="g-flower-gold"/>
    <rect x="180" y="8" width="6" height="6" class="g-flower-gold"/>
    <!-- Stones -->
    <rect x="110" y="38" width="16" height="8" class="g-stone"/>
    <rect x="250" y="40" width="12" height="6" class="g-stone"/>
  </g>

  <!-- Repeated blocks with variation across 1920px -->
  <g transform="translate(320, 0)">
    <rect x="25" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="31" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="95" y="2" width="6" height="14" class="g-grass-light"/>
    <rect x="160" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="230" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="110" y="6" width="8" height="8" class="g-flower-pink"/>
    <rect x="200" y="8" width="6" height="6" class="g-flower-gold"/>
    <rect x="70" y="36" width="14" height="7" class="g-stone"/>
  </g>

  <g transform="translate(640, 0)">
    <rect x="15" y="2" width="6" height="14" class="g-grass-light"/>
    <rect x="21" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="85" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="150" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="220" y="2" width="6" height="14" class="g-grass-light"/>
    <rect x="65" y="6" width="8" height="8" class="g-flower-pink"/>
    <rect x="180" y="6" width="6" height="6" class="g-flower-gold"/>
    <rect x="130" y="38" width="16" height="8" class="g-stone"/>
  </g>

  <g transform="translate(960, 0)">
    <rect x="35" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="41" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="115" y="2" width="6" height="14" class="g-grass-light"/>
    <rect x="180" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="250" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="130" y="6" width="8" height="8" class="g-flower-pink"/>
    <rect x="210" y="8" width="6" height="6" class="g-flower-gold"/>
    <rect x="80" y="36" width="14" height="7" class="g-stone"/>
  </g>

  <g transform="translate(1280, 0)">
    <rect x="15" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="21" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="75" y="2" width="6" height="14" class="g-grass-light"/>
    <rect x="160" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="230" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="55" y="6" width="8" height="8" class="g-flower-pink"/>
    <rect x="190" y="6" width="6" height="6" class="g-flower-gold"/>
    <rect x="110" y="38" width="16" height="8" class="g-stone"/>
  </g>

  <g transform="translate(1600, 0)">
    <rect x="25" y="2" width="6" height="14" class="g-grass-light"/>
    <rect x="31" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="95" y="4" width="6" height="12" class="g-grass-light"/>
    <rect x="170" y="0" width="8" height="16" class="g-grass-light"/>
    <rect x="240" y="2" width="6" height="14" class="g-grass-light"/>
    <rect x="120" y="6" width="8" height="8" class="g-flower-pink"/>
    <rect x="200" y="8" width="6" height="6" class="g-flower-gold"/>
  </g>
</svg>
