<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges">
  <defs>
    <style>
      .p-hair { fill: #2B2D42; }
      .p-skin { fill: #FFDFC4; }
      .p-shadow { fill: #E8B490; }
      .p-hoodie { fill: #8D5B4C; }
      .p-hoodie-dark { fill: #6F4539; }
      .p-trim { fill: #E07A5F; }
      .p-headset { fill: #D68C72; }
      .p-desk { fill: #3D405B; }
      .p-laptop { fill: #E0E1DD; }
      .p-screen { fill: #7EE7E2; }
      .p-glow { fill: #A8DADC; opacity: 0.35; }
      .p-mug { fill: #F4A261; }
      .p-steam { fill: #FDF0ED; opacity: 0.7; }
    </style>
  </defs>

  <!-- Circular Portal / Pastel Sun Halo -->
  <circle cx="64" cy="64" r="54" fill="#FFE5D9" opacity="0.6"/>
  <circle cx="64" cy="64" r="46" fill="#FFCAD4" opacity="0.4"/>

  <!-- Character Hair & Head -->
  <rect x="44" y="24" width="40" height="10" class="p-hair"/>
  <rect x="38" y="32" width="52" height="14" class="p-hair"/>
  <rect x="36" y="44" width="8" height="18" class="p-hair"/>
  <rect x="84" y="44" width="8" height="18" class="p-hair"/>
  <rect x="44" y="32" width="10" height="12" class="p-hair"/>
  <rect x="74" y="32" width="10" height="10" class="p-hair"/>

  <!-- Face -->
  <rect x="44" y="42" width="40" height="22" class="p-skin"/>
  <rect x="48" y="64" width="32" height="6" class="p-shadow"/>

  <!-- Developer Headset -->
  <rect x="32" y="46" width="6" height="14" class="p-headset"/>
  <rect x="90" y="46" width="6" height="14" class="p-headset"/>
  <rect x="38" y="22" width="52" height="4" class="p-headset"/>

  <!-- Eyes (Big intelligent warm eyes) -->
  <rect x="50" y="48" width="6" height="8" fill="#1E1B18"/>
  <rect x="50" y="48" width="3" height="3" fill="#FFFFFF"/>
  <rect x="72" y="48" width="6" height="8" fill="#1E1B18"/>
  <rect x="72" y="48" width="3" height="3" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <rect x="46" y="56" width="5" height="3" fill="#FF85A1" opacity="0.7"/>
  <rect x="77" y="56" width="5" height="3" fill="#FF85A1" opacity="0.7"/>

  <!-- Smile -->
  <rect x="61" y="60" width="6" height="2" fill="#1E1B18"/>

  <!-- Hoodie Shoulders & Body -->
  <rect x="40" y="70" width="48" height="22" class="p-hoodie"/>
  <rect x="56" y="70" width="16" height="22" class="p-trim"/>
  <rect x="34" y="74" width="8" height="18" class="p-hoodie-dark"/>
  <rect x="86" y="74" width="8" height="18" class="p-hoodie-dark"/>

  <!-- Desktop Surface in front -->
  <rect x="18" y="92" width="92" height="24" class="p-desk"/>
  <rect x="18" y="92" width="92" height="3" fill="#5A5E82"/>

  <!-- Laptop Base & Screen Glow -->
  <polygon points="46,104 82,104 88,112 40,112" class="p-laptop"/>
  <!-- Open Laptop Lid -->
  <rect x="48" y="86" width="32" height="18" class="p-laptop"/>
  <rect x="50" y="88" width="28" height="14" class="p-screen"/>
  <!-- Code lines on screen -->
  <rect x="53" y="91" width="12" height="2" fill="#1D2D44"/>
  <rect x="53" y="95" width="18" height="2" fill="#1D2D44"/>
  <rect x="53" y="99" width="10" height="2" fill="#1D2D44"/>

  <!-- Ambient Screen Glow cone on face -->
  <polygon points="50,88 78,88 76,70 52,70" class="p-glow"/>

  <!-- Coffee Mug -->
  <rect x="94" y="96" width="10" height="12" class="p-mug"/>
  <rect x="104" y="99" width="3" height="6" class="p-mug"/>
  <!-- Steam -->
  <rect x="96" y="91" width="2" height="3" class="p-steam"/>
  <rect x="100" y="88" width="2" height="4" class="p-steam"/>
</svg>
