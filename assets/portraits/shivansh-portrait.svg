<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges">
  <defs>
    <style>
      .p-hair { fill: #2B2D42; }
      .p-skin { fill: #FFDFC4; }
      .p-shadow { fill: #E8B490; }
      .p-hoodie { fill: #8D5B4C; }
      .p-hoodie-dark { fill: #6F4539; }
      .p-trim { fill: #E07A5F; }
      .p-headset { fill: #D68C72; }
    </style>
  </defs>

  <!-- Clean portrait frame -->
  <rect x="0" y="0" width="128" height="128" fill="#FDF0ED" rx="8"/>
  <rect x="6" y="6" width="116" height="116" fill="#FAF0E6" stroke="#E8D1C5" stroke-width="2"/>

  <!-- Character Hair & Head -->
  <rect x="44" y="22" width="40" height="10" class="p-hair"/>
  <rect x="38" y="30" width="52" height="14" class="p-hair"/>
  <rect x="36" y="42" width="8" height="18" class="p-hair"/>
  <rect x="84" y="42" width="8" height="18" class="p-hair"/>
  <rect x="44" y="30" width="10" height="12" class="p-hair"/>
  <rect x="74" y="30" width="10" height="10" class="p-hair"/>

  <!-- Face -->
  <rect x="44" y="40" width="40" height="24" class="p-skin"/>
  <rect x="48" y="64" width="32" height="6" class="p-shadow"/>

  <!-- Developer Headset -->
  <rect x="32" y="44" width="6" height="16" class="p-headset"/>
  <rect x="90" y="44" width="6" height="16" class="p-headset"/>
  <rect x="38" y="20" width="52" height="4" class="p-headset"/>

  <!-- Eyes -->
  <rect x="50" y="48" width="6" height="8" fill="#1E1B18"/>
  <rect x="50" y="48" width="3" height="3" fill="#FFFFFF"/>
  <rect x="72" y="48" width="6" height="8" fill="#1E1B18"/>
  <rect x="72" y="48" width="3" height="3" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <rect x="46" y="56" width="5" height="3" fill="#FF85A1" opacity="0.7"/>
  <rect x="77" y="56" width="5" height="3" fill="#FF85A1" opacity="0.7"/>

  <!-- Confident warm smile -->
  <rect x="59" y="60" width="10" height="2" fill="#1E1B18"/>
  <rect x="61" y="62" width="6" height="1" fill="#1E1B18"/>

  <!-- Shoulders / Hoodie -->
  <rect x="34" y="72" width="60" height="46" class="p-hoodie"/>
  <rect x="54" y="72" width="20" height="46" class="p-trim"/>
  <rect x="24" y="80" width="12" height="38" class="p-hoodie-dark"/>
  <rect x="92" y="80" width="12" height="38" class="p-hoodie-dark"/>
</svg>
